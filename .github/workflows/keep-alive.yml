name: Keep-Alive (prevent Render cold starts)

on:
  schedule:
    # Every 10 minutes — keeps both services warm
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Check secrets are configured
      run: |
        if [ -z "${{ secrets.PYTHON_SERVICE_URL }}" ]; then
          echo "::error::PYTHON_SERVICE_URL secret is not set. Add it in GitHub repo Settings → Secrets and variables → Actions."
          exit 1
        fi
        if [ -z "${{ secrets.BACKEND_SERVICE_URL }}" ]; then
          echo "::error::BACKEND_SERVICE_URL secret is not set. Add it in GitHub repo Settings → Secrets and variables → Actions."
          exit 1
        fi

    - name: Ping Python analysis service
      env:
        PYTHON_URL: ${{ secrets.PYTHON_SERVICE_URL }}
      run: |
        URL="${PYTHON_URL}/health"
        echo "Pinging $URL ..."
        for i in 1 2 3; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "  Attempt $i: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  Analysis service is alive."
            exit 0
          fi
          sleep 5
        done
        echo "::warning::Analysis service did not return 200 after 3 attempts. It may be starting up."
        exit 0  # Don't fail the workflow — cold start is expected

    - name: Ping Node.js backend service
      env:
        BACKEND_URL: ${{ secrets.BACKEND_SERVICE_URL }}
      run: |
        URL="${BACKEND_URL}/api/health"
        echo "Pinging $URL ..."
        for i in 1 2 3; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "  Attempt $i: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  Backend service is alive."
            exit 0
          fi
          sleep 5
        done
        echo "::warning::Backend service did not return 200 after 3 attempts. It may be starting up."
        exit 0
